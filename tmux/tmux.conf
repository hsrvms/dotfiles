# =============================================================
#  portable .tmux.conf  —  works locally and on remote servers
#  target: tmux 2.1+   |   default prefix: Ctrl+b
# =============================================================

# ---- core ---------------------------------------------------
set -g base-index 1                      # windows start at 1
set -g pane-base-index 1                 # panes start at 1
set -g renumber-windows on               # no gaps when closing windows
set -g history-limit 50000               # bigger scrollback
set -g escape-time 10                    # snappier prefix handling
set -g focus-events on
set -g aggressive-resize on
set -g set-titles on
set -g display-time 1500

# ---- terminal ------------------------------------------------
# 256-color terminfo when present, safe fallback otherwise
if-shell "infocmp tmux-256color >/dev/null 2>&1" \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# mouse support (tmux 2.1+): scroll, click pane, drag borders
if-shell "tmux -V | grep -Eq 'tmux (2\.[1-9]|[3-9]\.)'" 'set -g mouse on'

# ---- keys ----------------------------------------------------
set -g mode-keys vi                      # vi keys in copy mode
set -g status-keys vi
set -g extended-keys on

# vi-style pane navigation (matches zellij hjkl habit)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# l now moves right, so last-window moves to Tab
bind Tab last-window

# splits: defaults plus mnemonic aliases
bind '"'  split-window -v -c "#{pane_current_path}"
bind '%'  split-window -h -c "#{pane_current_path}"
bind '_'  split-window -v -c "#{pane_current_path}"
bind '|'  split-window -h -c "#{pane_current_path}"

# new window in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# reload this config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- status bar (oh-my-tmux powerline look) ------------------
# palette from https://github.com/gpakosz/.tmux (default theme)
set -g status-style "fg=#8a8a8a,bg=#080808"
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 80

# left: yellow "❐ session" block + powerline triangle into the bar
set -g status-left "#[fg=#080808,bg=#ffff00,bold] #S #[fg=#ffff00,bg=#080808,none] "

# right: dark time/date | red username | white hostname
set -g status-right "#[fg=#8a8a8a,bg=#080808] %R %d %b #[fg=#d70000,bg=#080808]#[fg=#e4e4e4,bg=#d70000] #(whoami) #[fg=#e4e4e4,bg=#d70000]#[fg=#080808,bg=#e4e4e4,bold] #h "

set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#080808,bg=#00afff]#[fg=#080808,bg=#00afff,bold] #I #W #[fg=#00afff,bg=#080808,none] "

set -g message-style "fg=#080808,bg=#ffff00,bold"
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#00afff"

# =============================================================
#  optional — uncomment as desired
# =============================================================

# Change prefix to Ctrl+g to match zellij
# (note: unconfigured remote boxes will still use Ctrl+b)
# unbind C-b
# set -g prefix C-g
# bind C-g send-prefix

# Resize panes with Alt+arrows (no prefix needed)
# bind -n M-Left   resize-pane -L 5
# bind -n M-Down   resize-pane -D 5
# bind -n M-Up     resize-pane -U 5
# bind -n M-Right  resize-pane -R 5

# =============================================================
# TPM - START
# =============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save every 15 minutes
set -g @continuum-save-interval '15'

# Restore the last saved session when tmux starts
set -g @continuum-restore 'on'

# Optional: restore pane programs where possible
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM; keep this last
run '~/.tmux/plugins/tpm/tpm'

# =============================================================
# TPM - END
# =============================================================
