# Hide the default bar on the internal laptop screen (eDP-1)
# when docked with an external monitor. The external bar stays visible.
#
# Per-monitor override: first match wins. "eDP-1" matches the connector name.
# Only `enabled` is overridden here; all other bar settings fall through
# to [bar.default].
[bar.default.monitor.laptop]
match = "eDP-1"
enabled = false