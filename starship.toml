# Starship prompt config
# Managed in ~/dotfiles, symlinked to ~/.config/starship.toml
# Reproduces the stock Starship default look:
#   user in 🌐 host in /path ❯

add_newline = true
scan_timeout = 10

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$golang\
$nodejs\
$java\
$package\
$cmd_duration\
$line_break\
$character"""

[username]
show_always = true
format = "[$user]($style) in "
style_root = "red bold"
style_user = "yellow bold"

[hostname]
ssh_only = true
ssh_symbol = "🌐 "
format = "[$ssh_symbol$hostname]($style) in "
style = "green dimmed bold"

[directory]
truncation_length = 3
truncation_symbol = "…/"
read_only = " [🔒]"
style = "cyan bold"

[git_branch]
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_state]
style = "bold yellow"

[git_status]
style = "bold cyan"

# Language module logo color — separates the brand logo from the version text
[python]
format = " [$symbol](bold magenta) [$version]($style) "
symbol = "\uE73C"
style = "bold green"

[golang]
format = " [$symbol](bold magenta) [$version]($style) "
symbol = "\uE627"
style = "bold cyan"

[nodejs]
format = " [$symbol](bold magenta) [$version]($style) "
symbol = "\uE719"
style = "bold green"

[java]
format = " [$symbol](bold magenta) [$version]($style) "
symbol = "\uE738"
style = "bold yellow"

[package]
format = " [$symbol](bold magenta) [$version]($style) "
symbol = "\uF03D3"
style = "bold yellow"

[cmd_duration]
min_time = 2000
show_milliseconds = true
format = "took [$duration]($style) "
style = "bold yellow"

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"