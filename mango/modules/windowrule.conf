# To find app_id use the command below
# mmsg -w -c


window_rule=app_id:satty,is_floating:1

window_rule=app_id:^(PacketTracer)$,is_floating:1,width:500
# window_rule=app_id:^(dev.zed.Zed)$,is_floating:1,width:500
window_rule=app_id:^(zen-browser)$,is_floating:1,width:500
#windowrule=app_id:^(helium)$,is_floating:1,width:500
window_rule=app_id:^(org.mozilla.Thunderbird)$,is_floating:1,width:500
window_rule=app_id:Pinentry-gtk,is_floating:1


# AutoStart on Boot
window_rule=app_id:discord,tags:8
window_rule=app_id:webcord,tags:8
window_rule=app_id:helium,tags:1
window_rule=app_id:zen,tags:1
window_rule=app_id:foot-boot,tags:3
