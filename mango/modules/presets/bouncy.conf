# Mango Animation Preset — bouncy
# Springy overshoot curves that "pop" in and out. Playful and energetic.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.35
zoom_end_ratio=1.05
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.85
animation_duration_move=280
animation_duration_open=280
animation_duration_tag=280
animation_duration_close=240
animation_duration_focus=140
# Overshooting bezier curves (y outside 0..1 -> springy)
animation_curve_open=0.34,1.56,0.64,1
animation_curve_move=0.34,1.56,0.64,1
animation_curve_tag=0.34,1.56,0.64,1
animation_curve_close=0.34,1.56,0.64,1
animation_curve_focus=0.34,1.56,0.64,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.34,1.56,0.64,1